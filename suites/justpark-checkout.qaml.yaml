# suites/examples/saucedemo-login.qaml.yaml
name: JustPark login, search, and checkout
description: Validate the standard flow for a user making a booking on Web
base_url: https://e2e.justpark.me
config:
  max_actions_per_step: 100      # Jev decision-cycle budget per step
  step_timeout_ms: 120000
  continue_on_failure: true
  # clear_browser_state: true   # wipe cookies/storage at base_url before step 1
                                # (off by default: state carries into the run)
  verdict_threshold: 0.35        # Jev noul probability required to pass
  operation_confidence_threshold: 0.55  # below this the loop WAITs, then BLOCKs
session:                        # optional, forwarded to Steel
  block_ads: true
  dimensions: { width: 1280, height: 800 }
  # proxy_url: user:pass@host:port   # bring-your-own proxy (local + cloud)
  # Cloud-only keys (use_proxy, solve_captcha) are rejected when the
  # configured Steel instance is local — see stage 02.
env:                            # names that must exist in process env
  - SAUCE_USERNAME
  - SAUCE_PASSWORD
  - CARD_NUMBER
  - CARD_EXPIRY
  - CARD_CVV
steps:
  # - id: accept-cookies
  #   instruction: if the cookie banner is present, accept all cookies
  #   expect: that cookies were accepted
  - id: login
    instruction: login to the website with ${SAUCE_USERNAME} and ${SAUCE_PASSWORD} if the button is showing
    expect: the top bar to have the text "Nigel"
  - id: search-for-a-space
    instruction: search for parking in Camden Town. Make sure to select the entry from the dropdown
    expect: the page to contain search pins with prices
  - id: search-for-a-space-2
    instruction: Set the search from time to be 29/11/2026 at 10:00
    expect: n/a
  - id: search-for-a-space-3
    instruction: Set the search until time to be 29/11/2026 at 18:00
    expect: n/a
  - id: select-listing
    instruction: select a listing from the available results
    expect: a button showing the text "Reserve" with a price
  - id: go-to-checkout
    instruction: click the reserve button
    expect: the checkout screen to show
  - id: add-phone-number
    instruction: add a UK mobile phone number in the phone number input and save
    expect: n/a
  - id: change-payment-card
    instruction: in Payment information, click the change button
    expect: n/a
  - id: change-payment-card-2
    instruction: Click the payment card ending 1111
    expect: n/a
  - id: checkout
    instruction: checkout the booking made in the UI
    expect: The booking details screen to show with a confirmation and booking ID
